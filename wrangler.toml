name = "pres28"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[triggers]
crons = ["37 * * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ingest/*", "/export/*", "/status", "/backfill", "/compact"]

[[d1_databases]]
binding = "DB"
database_name = "pres28"
database_id = "8ff4f23d-2eec-4494-b432-27e75c52b175"
