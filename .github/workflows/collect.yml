name: collect

on:
  schedule:
    - cron: "11 * * * *" # off the top of the hour, when GitHub is busiest and may drop runs
  workflow_dispatch:
    inputs:
      tasks:
        description: "Comma-separated tasks, or all. Blank follows the schedule."
        required: false
        default: ""

concurrency:
  group: collect
  cancel-in-progress: false

# Write access is only for the monthly keepalive commit below.
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: node collect/run.mjs
        env:
          INGEST_URL: https://pres28.audrze.workers.dev
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          TASKS: ${{ inputs.tasks }}
      # GitHub turns off schedules on public repos after 60 days with no activity. Nobody
      # should have to remember that, so a small commit every 30 days keeps this one alive.
      - name: Keep the schedule alive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the schedule active"
            git push
          fi
